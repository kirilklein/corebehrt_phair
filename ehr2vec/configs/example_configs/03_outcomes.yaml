env: local
project: "PHAIR"
paths:
  run_name: _example
  output_path: "outcomes"
outcomes_name: "EXAMPLE_OUTCOME"
features_dir: outputs/example_features
loader:
  data_dir: example_data
  concepts: [
    medication,
    diagnose
  ]
  batch_size: 3000
  chunksize: 100000
outcomes:
  EXAMPLE_OUTCOME: 
    type: [CONCEPT]
    match: [['DT148XX']]
    exclude: ['DT148XX2']
    match_how: contains
    case_sensitive: true
  EXAMPLE_CONTROL:
    type: [CONCEPT]
    match: [['M3']]  
    match_how: startswith
    case_sensitive: true
  EXAMPLE_CENSOR:
    type: [CONCEPT]
    match: [['M314076']]
    match_how: startswith
    case_sensitive: false
    