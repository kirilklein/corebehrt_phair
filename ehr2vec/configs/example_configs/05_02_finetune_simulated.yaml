env: local
run_name: &default_run_name test
project: &default_project "PHAIR"

paths:
  pretrain_model_path: "outputs/example_pretraining/example"
  outcome: "outputs/example_features/outcomes/EXAMPLE_CENSOR_simulated_outcome/SIMULATED.csv"
  exposure: "outputs/example_features/outcomes/EXAMPLE_OUTCOME/EXAMPLE_CENSOR.csv"
  run_name: *default_run_name
  tokenized_file: "tokenized_finetune.pt" # can also be a list
  tokenized_pids: "pids_finetune.pt" # can also be a list
  predefined_splits: "outputs/example_pretraining/example/finetune_EXAMPLE_CENSOR_censored_24_hours_pre_EXAMPLE_CENSOR_followup_start_1_hours_pre_index_date_run_test"

model:
  pool_type: "gru"
  bidirectional: true
  use_exposure: true
  # classifier: "big"

calibration: isotonic

data:
  # num_patients: 300 
  val_split: 0.1
  test_split: 0
  truncation_len: 128
  min_age: 0
  max_age: 70
  min_len: 2
  # number_of_train_patients: 10
  cv_folds: 2


outcome: 
  n_hours_censoring: -24 # censor time after index date (negative means before)
  n_hours_start_follow_up: 1
  first_time_outcomes_only: False # only consider patients with no outcome before index date/ patient with outcome before index date are excluded
  control_code: PLACEHOLDER_1 # code to be used for "no exposure"
  keep_codes: [M314076, PLACEHOLDER_1] # list of regex to not censor (first occurence is kept) # use ^exactmatch$ for exact matches

trainer_args:
  sampler: true
  sample_weight_function:
    _target_: ehr2vec.evaluation.utils.inverse_sqrt # function to calculate sample weights
  sample_weight_multiplier: 1 # adjust the sampling weight of the positive class (1 is balanced)
  pos_weight: null # weight for positive class in the loss
  batch_size: 256
  val_batch_size: 256
  effective_batch_size: 256
  epochs: 5
  info: true
  gradient_clip: 
    clip_value: 1.0
  mixed_precision: false
  shuffle: true
  checkpoint_frequency: 1
  early_stopping: 2
  stopping_criterion: roc_auc
  
optimizer:
  lr: 5e-3
  eps: 1e-6

scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  num_warmup_epochs: 1

metrics:
  accuracy:
    _target_: ehr2vec.evaluation.metrics.Accuracy
    threshold: 0.6
  balanced_accuracy:
    _target_: ehr2vec.evaluation.metrics.Balanced_Accuracy
  precision:
    _target_: ehr2vec.evaluation.metrics.Precision
  recall:
    _target_: ehr2vec.evaluation.metrics.Recall
  roc_auc:
    _target_: ehr2vec.evaluation.metrics.ROC_AUC
  pr_auc:
    _target_: ehr2vec.evaluation.metrics.PR_AUC

  
wandb_kwargs:
  project: *default_project
  name: *default_run_name
  group: finetuning_simulated
  job_type: test
  tags:
    - baseline

