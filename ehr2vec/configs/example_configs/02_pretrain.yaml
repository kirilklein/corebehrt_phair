env: local
run_name: &default_run_name example
project: &default_project "PHAIR"
paths:
  data_path: outputs/example_features
  output_path: outputs/example_pretraining
  type: diag
  run_name: *default_run_name
  tokenized_dir: tokenized
  # predefined_splits: outputs/pretraining/behrt_base
  
data:
  dataset:
    select_ratio: 1.
    masking_ratio: .8
    replace_ratio: .1
    ignore_special_tokens: true
  truncation_len: 128
  val_ratio: 0.2
  min_len: 2

trainer_args:
  batch_size: 256
  effective_batch_size: 256
  epochs: 2
  info: true
  sampler: null
  gradient_clip: 
    clip_value: 1.0
  mixed_precision: false
  shuffle: true
  early_stopping: null # num_epochs or null/false

model:
  # type_vocab_size should be > truncation_len//2 if sep token else >truncation len
  # !!! If you want to feed longer sequences during finetuning adjust type_vocab_size accordingly
  linear: true
  hidden_size: 48
  num_hidden_layers: 2
  num_attention_heads: 3
  intermediate_size: 48
  type_vocab_size: 240 #  if discrete_abspos_embeddings: true, give the range of abspos in months
  abspos_embeddings: false
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  layer_norm_eps: 1e-6
  hidden_act: gelu
  # pool_type: mean
optimizer:
  lr: 1e-3
  eps: 1e-6

scheduler:
  _target_: transformers.get_linear_schedule_with_warmup
  num_warmup_epochs: 1
  num_training_epochs: 2

metrics:
  top1:
    _target_: ehr2vec.evaluation.metrics.PrecisionAtK
    topk: 1
  top10:
    _target_: ehr2vec.evaluation.metrics.PrecisionAtK
    topk: 10
  loss:
    _target_: ehr2vec.evaluation.metrics.LossAccessor
    loss_name: loss

wandb_kwargs:
  project: *default_project
  group: pretraining
  name: *default_run_name
  job_type: pretraining
  tags:
    - baseline
