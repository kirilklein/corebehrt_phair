env: local
project: &default_project PHAIR
run_name: &default_run_name test
wandb_kwargs:
  project: *default_project
  name: *default_run_name
  group: estimate_effect_binary
  job_type: test_bias
  tags:
    - synthea 
    - local
    - ATE
    - test
    - double_robust

paths:
  propensity_scores: "outputs/example_pretraining/example/finetune_EXAMPLE_CENSOR_censored_24_hours_pre_EXAMPLE_CENSOR_followup_start_1_hours_pre_index_date_run_test/predictions_and_targets.csv"
  outcome: "outputs/example_features/outcomes/EXAMPLE_OUTCOME/EXAMPLE_OUTCOME.csv"
  # used for double-robust estimation:
  outcome_predictions: "outputs/example_pretraining/example/finetune_SIMULATED_censored_24_hours_pre_EXAMPLE_CENSOR_followup_start_1_hours_post_index_date_run_test/predictions_and_targets_calibrated_isotonic.csv"
  outcome_predictions_counterfactual: "outputs/example_pretraining/example/finetune_SIMULATED_censored_24_hours_pre_EXAMPLE_CENSOR_followup_start_1_hours_post_index_date_run_test/counterfactual_predictions_test/counterfactual_predictions_calibrated_isotonic.csv"
  output_path: "outputs/experiments/test"
  run_name: *default_run_name

transform_function: "power_distortion"
transform_params:
  constants:
    sigma: 1.0
  ps: [0.1, 0.2, 0.3]
  y: [0.1, 0.2, 0.3]
  cf_offset: 1.0 # on top of y
  

estimator:
  methods: ["AIPW", "IPW"]
  effect_type: "ATE"
  n_bootstrap: 10

